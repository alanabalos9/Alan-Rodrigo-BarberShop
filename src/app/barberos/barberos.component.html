<div class="admin-container">
  <h2>Gestión de Barberos</h2>

  <div *ngIf="errorMensaje" class="mensaje error">{{ errorMensaje }}</div>

  <form [formGroup]="form" (ngSubmit)="agregarBarbero()" class="form-barbero">
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="Nombre">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Apellido</mat-label>
      <input matInput formControlName="Apellido">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Especialidad</mat-label>
      <input matInput formControlName="Especialidad">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>URL de foto</mat-label>
      <input matInput formControlName="FotoPerfil">
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="guardando">
      {{ guardando ? 'Guardando...' : 'Agregar Barbero' }}
    </button>
  </form>

  <table class="tabla-barberos">
    <thead>
      <tr><th>Foto</th><th>Nombre</th><th>Apellido</th><th>Especialidad</th><th></th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let b of barberos">
        <td><img *ngIf="b.FotoPerfil" [src]="b.FotoPerfil" alt="" class="foto-mini"></td>
        <td>{{ b.Nombre }}</td>
        <td>{{ b.Apellido }}</td>
        <td>{{ b.Especialidad }}</td>
        <td><button mat-stroked-button color="warn" (click)="eliminarBarbero(b.id)">Eliminar</button></td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="barberos.length === 0">No hay barberos cargados todavía.</p>
</div>
